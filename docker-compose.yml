services:
  mongo:
    image: mongo:7
    container_name: la-morada-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - la_morada_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: la-morada-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - la_morada_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  la_morada_mongo_data:
  la_morada_redis_data: